<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Face Recognition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 10px;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    overflow: hidden;
    min-height: 95vh;
  }
  
  .header {
    background: linear-gradient(135deg, #2c3e50, #34495e);
    color: white;
    padding: 20px;
    text-align: center;
  }
  
  .header h1 {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    margin-bottom: 10px;
  }
  
  .main-content {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
  }
  
  @media (min-width: 768px) {
    .main-content {
      flex-direction: row;
      height: calc(100vh - 200px);
    }
  }
  
  .camera-section {
    flex: 1;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    min-height: 300px;
  }
  
  .controls-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  
  #camera-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  
  .camera-overlay {
    position: absolute;
    bottom: 15px;
    left: 15px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  
  .control-group {
    background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  
  .form-group {
    margin-bottom: 15px;
  }
  
  label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: #2c3e50;
  }
  
  input, select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    transition: border-color 0.3s;
  }
  
  input:focus, select:focus {
    outline: none;
    border-color: #3498db;
  }
  
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 15px 0;
  }
  
  button {
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    color: white;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #3498db, #2980b9);
  }
  
  .btn-success {
    background: linear-gradient(135deg, #27ae60, #229954);
  }
  
  .btn-danger {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
  }
  
  .btn-warning {
    background: linear-gradient(135deg, #f39c12, #e67e22);
  }
  
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  button:active {
    transform: translateY(0);
  }
  
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  
  #message-box {
    background: #fff3cd;
    border: 1px solid #ffeaa7;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0;
    color: #856404;
    font-weight: 500;
    min-height: 60px;
    display: flex;
    align-items: center;
  }
  
  .users-list {
    background: linear-gradient(to bottom, #e3f2fd, #bbdefb);
    border-radius: 15px;
    padding: 20px;
    flex: 1;
    overflow-y: auto;
    max-height: 300px;
  }
  
  .users-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #90caf9;
  }
  
  .users-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: #1565c0;
  }
  
  .user-count {
    background: #1976d2;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.9rem;
  }
  
  .user-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    margin-bottom: 8px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 10px;
    border-left: 4px solid #1976d2;
    transition: all 0.3s;
  }
  
  .user-entry:hover {
    background: rgba(255, 255, 255, 1);
    transform: translateX(5px);
  }
  
  .delete-user {
    background: #e53935;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.3s;
  }
  
  .delete-user:hover {
    background: #c62828;
    transform: scale(1.1);
  }
  
  .empty-list {
    text-align: center;
    color: #78909c;
    font-style: italic;
    padding: 20px;
  }
  
  .status-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
  }
  
  .status-online {
    background: #4caf50;
  }
  
  .status-offline {
    background: #f44336;
  }
  
  /* Mobile optimizations */
  @media (max-width: 767px) {
    body {
      padding: 5px;
    }
    
    .container {
      border-radius: 15px;
    }
    
    .main-content {
      padding: 15px;
      gap: 15px;
    }
    
    .camera-section {
      min-height: 250px;
    }
    
    .btn-group {
      grid-template-columns: 1fr;
    }
    
    button {
      padding: 12px;
      font-size: 14px;
    }
    
    input, select {
      padding: 10px 12px;
      font-size: 14px;
    }
  }
  
  /* Very small screens */
  @media (max-width: 480px) {
    .header {
      padding: 15px;
    }
    
    .control-group, .users-list {
      padding: 15px;
    }
    
    .user-entry {
      padding: 10px;
      font-size: 14px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧠 Smart Face Recognition</h1>
      <p>Register and recognize faces in real-time</p>
    </div>
    
    <div class="main-content">
      <div class="camera-section">
        <video id="camera-preview" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="camera-overlay">
          <span class="status-indicator" id="camera-status">●</span>
          <span id="camera-status-text">Camera Off</span>
        </div>
      </div>
      
      <div class="controls-section">
        <div class="control-group">
          <div class="form-group">
            <label for="camera-select">📷 Camera</label>
            <select id="camera-select">
              <option value="">Loading cameras...</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="username">👤 Username</label>
            <input type="text" id="username" placeholder="Enter your name" />
          </div>
          
          <div class="btn-group">
            <button id="register-btn" class="btn-primary">📸 Register</button>
            <button id="recognize-btn" class="btn-success">🔍 Recognize</button>
          </div>
          
          <button id="stop-btn" class="btn-danger">⏹️ Stop Camera</button>
          
          <div id="message-box">
            System ready. Please allow camera access.
          </div>
        </div>
        
        <div class="users-list" id="user-list">
          <div class="users-header">
            <div class="users-title">📋 Registered Users</div>
            <div class="user-count">0</div>
          </div>
          <div class="empty-list">No users registered yet</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // JavaScript code remains the same as before
    const video = document.getElementById('camera-preview');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const cameraSelect = document.getElementById('camera-select');
    const usernameInput = document.getElementById('username');
    const registerBtn = document.getElementById('register-btn');
    const recognizeBtn = document.getElementById('recognize-btn');
    const stopBtn = document.getElementById('stop-btn');
    const messageBox = document.getElementById('message-box');
    const userList = document.getElementById('user-list');
    const cameraStatus = document.getElementById('camera-status');
    const cameraStatusText = document.getElementById('camera-status-text');

    let stream = null;
    let isCameraOn = false;
    let mode = null;
    let registerImageCount = 0;
    const maxRegisterImages = 12;
    let registerInterval = null;
    let recognizeInterval = null;

    // Update camera status
    function updateCameraStatus(on) {
      if (on) {
        cameraStatus.style.color = '#4caf50';
        cameraStatusText.textContent = 'Camera On';
      } else {
        cameraStatus.style.color = '#f44336';
        cameraStatusText.textContent = 'Camera Off';
      }
    }

    async function getCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, i) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Camera ${i + 1}`;
          cameraSelect.appendChild(option);
        });
        if (videoDevices.length > 0) {
          cameraSelect.value = videoDevices[0].deviceId;
        }
      } catch (e) {
        cameraSelect.innerHTML = '<option>No cameras found</option>';
      }
    }

    async function startCamera() {
      if (isCameraOn) return;
      try {
        const constraints = {
          video: { 
            deviceId: cameraSelect.value ? { exact: cameraSelect.value } : undefined,
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: 'user'
          },
          audio: false
        };
        
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        await new Promise((resolve) => {
          video.onloadedmetadata = () => resolve();
        });
        
        await video.play();

        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;

        isCameraOn = true;
        updateCameraStatus(true);
        messageBox.textContent = 'Camera started successfully.';
        messageBox.style.background = '#d4edda';
        messageBox.style.color = '#155724';
        messageBox.style.borderColor = '#c3e6cb';
      } catch (e) {
        messageBox.textContent = 'Failed to start camera: ' + e.message;
        messageBox.style.background = '#f8d7da';
        messageBox.style.color = '#721c24';
        messageBox.style.borderColor = '#f5c6cb';
        console.error('Camera error:', e);
      }
    }

    function stopCamera() {
      if (!isCameraOn) return;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      video.pause();
      video.srcObject = null;
      isCameraOn = false;
      mode = null;
      registerImageCount = 0;
      clearOverlay();
      clearIntervals();
      updateCameraStatus(false);
      messageBox.textContent = 'Camera stopped.';
      messageBox.style.background = '#fff3cd';
      messageBox.style.color = '#856404';
      messageBox.style.borderColor = '#ffeaa7';
    }

    function clearOverlay() {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
    }

    function clearIntervals() {
      if (registerInterval) clearInterval(registerInterval);
      if (recognizeInterval) clearInterval(recognizeInterval);
      registerInterval = null;
      recognizeInterval = null;
    }

    function captureFrame() {
      if (!isCameraOn || video.videoWidth === 0) return null;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    function drawFaceRectangles(faces) {
      clearOverlay();
      faces.forEach(face => {
        const { x, y, width, height, name, confidence } = face;
        ctx.strokeStyle = name === "Unknown" ? 'red' : 'green';
        ctx.fillStyle = name === "Unknown" ? 'red' : 'green';
        ctx.lineWidth = 3;
        ctx.font = 'bold 16px Arial';
        ctx.strokeRect(x, y, width, height);
        const label = `${name} (${confidence})`;
        const textMetrics = ctx.measureText(label);
        const textWidth = textMetrics.width;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(x, y - 25, textWidth + 10, 25);
        ctx.fillStyle = 'white';
        ctx.fillText(label, x + 5, y - 8);
      });
    }

    async function refreshUsers() {
      try {
        const res = await fetch('/get_users');
        const users = await res.json();
        const usersHeader = userList.querySelector('.users-header');
        userList.innerHTML = '';
        userList.appendChild(usersHeader);
        
        if (users.length === 0) {
          userList.innerHTML += '<div class="empty-list">No users registered yet</div>';
        } else {
          users.forEach(user => {
            const div = document.createElement('div');
            div.className = 'user-entry';
            div.innerHTML = `
              <span>${user}</span>
              <button class="delete-user" data-user="${user}" title="Delete user">Delete</button>
            `;
            userList.appendChild(div);
          });
          
          document.querySelectorAll('.delete-user').forEach(btn => {
            btn.onclick = async () => {
              if (confirm(`Delete user "${btn.dataset.user}"?`)) {
                try {
                  const res = await fetch('/delete_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: btn.dataset.user })
                  });
                  const json = await res.json();
                  if (json.status === 'success') {
                    messageBox.textContent = json.message;
                    messageBox.style.background = '#d4edda';
                    messageBox.style.color = '#155724';
                    refreshUsers();
                  } else {
                    messageBox.textContent = 'Delete failed: ' + json.message;
                    messageBox.style.background = '#f8d7da';
                    messageBox.style.color = '#721c24';
                  }
                } catch {
                  messageBox.textContent = 'Network error while deleting user.';
                  messageBox.style.background = '#f8d7da';
                  messageBox.style.color = '#721c24';
                }
              }
            };
          });
        }
        
        // Update user count
        const userCount = userList.querySelector('.user-count');
        userCount.textContent = users.length;
      } catch (e) {
        messageBox.textContent = 'Failed to load users.';
        messageBox.style.background = '#f8d7da';
        messageBox.style.color = '#721c24';
      }
    }

    // Registration function
    async function register() {
      const username = usernameInput.value.trim();
      if (!username) {
        alert('Please enter a username to register.');
        return;
      }

      await startCamera();
      if (!isCameraOn) {
        messageBox.textContent = 'Cannot start camera for registration.';
        return;
      }

      mode = 'register';
      registerImageCount = 0;
      messageBox.textContent = 'Registration started. Please face the camera clearly.';
      messageBox.style.background = '#fff3cd';
      messageBox.style.color = '#856404';

      registerInterval = setInterval(async () => {
        if (!isCameraOn || mode !== 'register') {
          clearInterval(registerInterval);
          return;
        }

        const image = captureFrame();
        if (!image) {
          messageBox.textContent = 'Failed to capture image.';
          return;
        }

        try {
          const res = await fetch('/register_image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, image })
          });
          const json = await res.json();

          if (json.status === 'success') {
            registerImageCount = json.count;
            messageBox.textContent = `📸 Captured image ${registerImageCount}/${maxRegisterImages}`;
            
            if (registerImageCount >= maxRegisterImages) {
              clearInterval(registerInterval);
              messageBox.textContent = '🤖 Training model, please wait...';
              
              setTimeout(async () => {
                const trainRes = await fetch('/train', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ username })
                });
                const trainJson = await trainRes.json();
                
                if (trainJson.status === 'success') {
                  messageBox.textContent = trainJson.message;
                  messageBox.style.background = '#d4edda';
                  messageBox.style.color = '#155724';
                } else {
                  messageBox.textContent = 'Training failed: ' + trainJson.message;
                  messageBox.style.background = '#f8d7da';
                  messageBox.style.color = '#721c24';
                }
                
                stopCamera();
                refreshUsers();
              }, 1000);
            }
          } else {
            messageBox.textContent = 'Error: ' + json.message;
            messageBox.style.background = '#f8d7da';
            messageBox.style.color = '#721c24';
            clearInterval(registerInterval);
            stopCamera();
          }
        } catch (error) {
          messageBox.textContent = 'Network error during registration.';
          messageBox.style.background = '#f8d7da';
          messageBox.style.color = '#721c24';
          console.error('Registration error:', error);
          clearInterval(registerInterval);
          stopCamera();
        }
      }, 1000);
    }

    // Recognition function
    async function recognize() {
      await startCamera();
      if (!isCameraOn) {
        messageBox.textContent = 'Cannot start camera for recognition.';
        return;
      }

      mode = 'recognize';
      messageBox.textContent = 'Recognition started...';
      messageBox.style.background = '#fff3cd';
      messageBox.style.color = '#856404';

      recognizeInterval = setInterval(async () => {
        if (!isCameraOn || mode !== 'recognize') {
          clearInterval(recognizeInterval);
          clearOverlay();
          return;
        }

        const image = captureFrame();
        if (!image) return;

        try {
          const res = await fetch('/recognize_image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image })
          });
          const json = await res.json();
          
          if (json.status === 'success') {
            if (json.faces && json.faces.length > 0) {
              drawFaceRectangles(json.faces);
              messageBox.textContent = json.message;
              messageBox.style.background = '#d4edda';
              messageBox.style.color = '#155724';
            } else {
              clearOverlay();
              messageBox.textContent = 'No faces detected.';
              messageBox.style.background = '#fff3cd';
              messageBox.style.color = '#856404';
            }
          } else {
            clearOverlay();
            messageBox.textContent = 'Recognition error: ' + json.message;
            messageBox.style.background = '#f8d7da';
            messageBox.style.color = '#721c24';
          }
        } catch (error) {
          messageBox.textContent = 'Network error during recognition.';
          messageBox.style.background = '#f8d7da';
          messageBox.style.color = '#721c24';
          console.error('Recognition error:', error);
        }
      }, 2000);
    }

    // Event listeners
    registerBtn.onclick = () => {
      if (isCameraOn) {
        alert('Please stop the current camera session before starting new.');
        return;
      }
      register();
    };

    recognizeBtn.onclick = () => {
      if (isCameraOn) {
        alert('Please stop the current camera session before starting new.');
        return;
      }
      recognize();
    };

    stopBtn.onclick = () => stopCamera();

    window.addEventListener('keydown', e => {
      if ((e.key === 'q' || e.key === 'Q') && isCameraOn) stopCamera();
    });

    // Initialize
    getCameras();
    refreshUsers();
    
    video.addEventListener('resize', () => {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
    });

    // Handle page visibility changes
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopCamera();
      }
    });
  </script>
</body>
</html>
